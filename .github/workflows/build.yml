name: Build desktop apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

  build-macos-arm64:
    name: macOS ARM64
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      # Без Apple Developer сертификата. Приложение подписывается ad-hoc
      # в scripts/after-pack.js, чтобы запускаться на Apple Silicon.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build macOS ARM64 DMG
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify DMG and signature
        run: |
          set -euo pipefail
          ls -lh release/*.dmg
          COUNT=$(find release -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "Ожидался ровно один DMG, найдено: $COUNT" >&2
            exit 1
          fi
          APP=$(find release -maxdepth 3 -type d -name 'NMB Notes.app' | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -n 12
          hdiutil verify release/*.dmg
          shasum -a 256 release/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="NMB Notes $GITHUB_REF_NAME"
            TARGET_ARGS=(--verify-tag)
          else
            TAG="latest"
            TITLE="NMB Notes — latest builds"
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          cat > release/release-notes.md <<'NOTES'
          Автоматическая сборка NMB Notes. Для каждой системы — один установочный файл.

          ### macOS ARM64 (Apple Silicon)
          1. Скачайте `NMB-Notes-*-mac-arm64.dmg`.
          2. Откройте DMG и перетащите **NMB Notes** в **Applications**.
          3. Сборка не нотаризована. Один раз выполните:
             ```bash
             xattr -cr "/Applications/NMB Notes.app"
             ```
          4. Запустите приложение (если macOS ругается — правый клик → «Открыть»).

          ### Windows x64
          1. Скачайте `NMB-Notes-*-win-x64-setup.exe`.
          2. Запустите установщик.
          3. Если SmartScreen предупреждает — **Подробнее → Выполнить всё равно** (сборка не подписана).

          Ключ DeepSeek добавляется в **Настройки → AI**.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              "${TARGET_ARGS[@]}" \
              --title "$TITLE" \
              --notes-file release/release-notes.md \
              || gh release upload "$TAG" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          fi

  build-windows-x64:
    name: Windows x64
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build Windows x64 installer
        run: npx electron-builder --win --x64 --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($files.Count -ne 1) {
            throw "Ожидался ровно один EXE, найдено: $($files.Count)"
          }
          $files | Format-List Name, Length
          Get-FileHash $files[0].FullName -Algorithm SHA256 | Format-List

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="NMB Notes $GITHUB_REF_NAME"
            TARGET_ARGS=(--verify-tag)
          else
            TAG="latest"
            TITLE="NMB Notes — latest builds"
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          cat > release/release-notes.md <<'NOTES'
          Автоматическая сборка NMB Notes. Для каждой системы — один установочный файл.

          ### macOS ARM64 (Apple Silicon)
          1. Скачайте `NMB-Notes-*-mac-arm64.dmg`.
          2. Откройте DMG и перетащите **NMB Notes** в **Applications**.
          3. Сборка не нотаризована. Один раз выполните:
             ```bash
             xattr -cr "/Applications/NMB Notes.app"
             ```
          4. Запустите приложение (если macOS ругается — правый клик → «Открыть»).

          ### Windows x64
          1. Скачайте `NMB-Notes-*-win-x64-setup.exe`.
          2. Запустите установщик.
          3. Если SmartScreen предупреждает — **Подробнее → Выполнить всё равно** (сборка не подписана).

          Ключ DeepSeek добавляется в **Настройки → AI**.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              "${TARGET_ARGS[@]}" \
              --title "$TITLE" \
              --notes-file release/release-notes.md \
              || gh release upload "$TAG" release/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          fi
