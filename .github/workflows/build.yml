name: Build desktop apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

  build-macos-arm64:
    name: macOS ARM64
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      # Без Apple Developer сертификата. Приложение подписывается ad-hoc
      # в scripts/after-pack.js, чтобы запускаться на Apple Silicon.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build macOS ARM64 DMG
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify DMG and signature
        run: |
          set -euo pipefail
          ls -lh release/*.dmg
          COUNT=$(find release -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "Ожидался ровно один DMG, найдено: $COUNT" >&2
            exit 1
          fi
          APP=$(find release -maxdepth 3 -type d -name 'NMB Notes.app' | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -n 12
          hdiutil verify release/*.dmg
          shasum -a 256 release/*.dmg

      - name: Publish rolling release (main)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-macos-arm64"
          cat > release/release-notes.md <<'NOTES'
          Автоматическая сборка NMB Notes для **macOS ARM64 (Apple Silicon)**.

          ### Установка
          1. Скачайте DMG-файл ниже.
          2. Откройте DMG и перетащите **NMB Notes** в папку **Applications**.
          3. Сборка не нотаризована. Один раз выполните в Terminal:
             ```bash
             xattr -cr "/Applications/NMB Notes.app"
             ```
          4. Запустите приложение (если macOS ругается — правый клик по иконке → «Открыть»).

          Ключ DeepSeek добавляется в **Настройки → AI**.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NMB Notes — macOS ARM64 (latest)" \
              --notes-file release/release-notes.md
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > release/release-notes.md <<'NOTES'
          Сборка NMB Notes для **macOS ARM64 (Apple Silicon)**.

          ### Установка
          1. Скачайте DMG-файл ниже.
          2. Откройте DMG и перетащите **NMB Notes** в папку **Applications**.
          3. Сборка не нотаризована. Один раз выполните в Terminal:
             ```bash
             xattr -cr "/Applications/NMB Notes.app"
             ```
          4. Запустите приложение (если macOS ругается — правый клик по иконке → «Открыть»).

          Ключ DeepSeek добавляется в **Настройки → AI**.
          NOTES

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file release/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "NMB Notes $GITHUB_REF_NAME" \
              --notes-file release/release-notes.md
          fi
